<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias de animales</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <main class="container section page-content">
        <div class="page-heading">
            <div>
                <span class="eyebrow">Clasificacion</span>
                <h1>Categorias de animales</h1>
                <p>Clasifica las razas como Domestico, Carnivoro, De compania, Guardian y otras.</p>
            </div>
            <a class="button" th:href="@{/categorias/nueva}">Nueva categoria</a>
        </div>

        <div class="alert success" th:if="${exito}" th:text="${exito}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Categoria</th>
                        <th>Descripcion</th>
                        <th class="actions">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td><span class="badge" th:text="${categoria.nombre}">Categoria</span></td>
                        <td th:text="${categoria.descripcion}">Descripcion</td>
                        <td class="actions">
                            <a class="button secondary small"
                               th:href="@{/categorias/editar/{id}(id=${categoria.id})}">Editar</a>
                            <form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}"
                                  method="post"
                                  onsubmit="return confirm('¿Desea eliminar esta categoria?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="button danger small" type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${categorias.isEmpty()}">
                        <td colspan="3">No hay categorias registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
