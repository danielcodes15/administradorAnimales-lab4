<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Categoria</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <main class="container section form-page">
        <a class="back-link" th:href="@{/categorias}">← Volver a categorias</a>
        <div class="form-card">
            <span class="eyebrow">Clasificacion</span>
            <h1 th:text="${titulo}">Categoria</h1>
            <form th:action="@{/categorias/guardar}" th:object="${categoriaAnimal}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{id}">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" th:field="*{nombre}"
                           placeholder="Ejemplo: Perro">
                    <span class="field-error" th:errors="*{nombre}"></span>
                </div>
                <div class="field">
                    <label for="descripcion">Descripcion</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="5"
                              placeholder="Describe esta categoria de animales"></textarea>
                    <span class="field-error" th:errors="*{descripcion}"></span>
                </div>
                <div class="form-actions">
                    <a class="button secondary" th:href="@{/categorias}">Cancelar</a>
                    <button class="button" type="submit">Guardar categoria</button>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
