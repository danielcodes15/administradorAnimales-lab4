<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login administrador</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos :: encabezado}"></header>
    <main class="container section form-page">
        <div class="form-card login-card">
            <span class="eyebrow">Acceso privado</span>
            <h1>Ingreso de administrador</h1>
            <p class="login-copy">Solo el administrador puede crear, editar o eliminar informacion.</p>

            <div class="alert error" th:if="${param.error}">
                Usuario o contrasena incorrectos.
            </div>
            <div class="alert success" th:if="${param.logout}">
                Sesion cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                           required>
                </div>
                <div class="field">
                    <label for="password">Contrasena</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>
                <div class="form-actions">
                    <a class="button secondary" th:href="@{/}">Volver</a>
                    <button class="button" type="submit">Ingresar</button>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
